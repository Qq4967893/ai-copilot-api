[alembic]
script_location = migrations
prepend_sys_path = .
# 刻意不在这里配 sqlalchemy.url —— DSN 由 migrations/env.py 从应用配置读取，
# 避免数据库凭据出现在这个提交进仓库的文件里。
path_separator = os

# 生成的迁移直接过一遍 lint + format，省得每次手动收拾。
# ruff_fix 要排在 ruff_format 前面：alembic 会把 ${imports} 插在模板固定位置，
# 导入顺序几乎必然需要重排。
[post_write_hooks]
hooks = ruff_fix,ruff_format
ruff_fix.type = exec
ruff_fix.executable = ruff
ruff_fix.options = check --fix --quiet REVISION_SCRIPT_FILENAME
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
